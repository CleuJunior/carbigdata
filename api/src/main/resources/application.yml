spring:
  application:
    name: ctkd
  datasource:
    url: jdbc:postgresql://localhost:5432/carbigdata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: 4f8c7b8e1d2a3c4e5f6a7b8c9d0e1f2a4f8c7b8e1d2a3c4e5f6a7b8c9d0e1f2a
    expiration: 1800000

aws:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin123
    bucket-name: occurrences

doc:
  swagger:
    tile: Carbigdata API
    description: REST API for managing clients, addresses, occurrences and photo attachments. All endpoints except /api/v1/auth/login require a Bearer JWT token.
    version: 1.0.0
    auth: bearerAuth