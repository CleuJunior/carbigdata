spring:
  application:
    name: ctkd
  datasource:
    url: jdbc:postgresql://localhost:5432/carbigdata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: 4f8c7b8e1d2a3c4e5f6a7b8c9d0e1f2a4f8c7b8e1d2a3c4e5f6a7b8c9d0e1f2a
    expiration: 86400000